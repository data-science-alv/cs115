      {name:"PBKDF2",salt:b64(blob.salt),iterations:ITER,hash:"SHA-256"},
      base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},key,b64(blob.ct));
    return new TextDecoder().decode(plain);
  }

  function inject(html){
    var host=document.getElementById("app");
    host.innerHTML=html;
    var scripts=host.querySelectorAll("script");
    for(var i=0;i<scripts.length;i++){
      var old=scripts[i], s=document.createElement("script");
      for(var j=0;j<old.attributes.length;j++)
        s.setAttribute(old.attributes[j].name, old.attributes[j].value);
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    }
  }

  document.getElementById("f").addEventListener("submit", async function(ev){
    ev.preventDefault();
    var phrase=pw.value.trim(); if(!phrase) return;
    go.disabled=true; msg.style.color="#a29e96"; msg.textContent="Checking…";

    // instructor first: its payload carries the student phrase plus the solutions
    try{
      var meta=JSON.parse(await open_(I, phrase));
      var body=await open_(S, meta.p);
      window.__LAB_MODE__="instructor"; window.__LAB_SOL__=meta.sol;
      gate.remove(); inject(body); return;
    }catch(e){}

    try{
      var body2=await open_(S, phrase);
      window.__LAB_MODE__="student"; window.__LAB_SOL__=null;
      gate.remove(); inject(body2); return;
    }catch(e){}

    msg.style.color="#d4564a";
    msg.textContent="That phrase does not unlock this activity. Check spelling and capitalisation.";
    go.disabled=false; pw.select();
  });

  pw.focus();
})();
</script>
