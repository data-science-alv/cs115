<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CS 115 — Load Test</title>
<style>
  :root{
    --bg:#f7f6f3; --surface:#ffffff; --ink:#1c1b19; --muted:#6b6862;
    --line:#e2dfd8; --accent:#8a3d2b; --accent-soft:#f3e7e2;
    --ok:#2f6b4f; --err:#a33a2a; --code-bg:#f2f0eb;
    --shadow:0 1px 2px rgba(28,27,25,.05), 0 8px 24px rgba(28,27,25,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14140f; --surface:#1e1e18; --ink:#eceae4; --muted:#a39f95;
      --line:#33322a; --accent:#e0866b; --accent-soft:#3a251d;
      --ok:#7fc09b; --err:#e8917f; --code-bg:#26261f;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.6 ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:44rem; margin:0 auto; padding:3rem 1.5rem 5rem}
  .eyebrow{
    font:600 .7rem/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent); margin:0 0 .9rem;
  }
  h1{font-size:1.95rem; line-height:1.2; margin:0 0 .7rem; font-weight:600; letter-spacing:-.01em}
  h2{font-size:1.15rem; margin:0 0 .3rem; font-weight:600}
  .lede{color:var(--muted); margin:0; font-size:1.02rem}
  .hd{margin-bottom:2rem}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:1.4rem 1.5rem; margin-bottom:1.1rem; box-shadow:var(--shadow);
  }
  .sub,.hint,.statusSub{color:var(--muted); font-size:.9rem}
  .hint{margin:1rem 0 0; padding-top:.9rem; border-top:1px solid var(--line)}
  .statusRow{display:flex; gap:.9rem; align-items:flex-start}
  .statusLabel{margin:0 0 .2rem; font-weight:600}
  .statusSub{margin:0}
  .spinner{
    flex:none; width:18px; height:18px; margin-top:.25rem; border-radius:50%;
    border:2px solid var(--line); border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){ .spinner{animation-duration:2.4s} }
  .bar{height:4px; background:var(--line); border-radius:99px; margin-top:1.1rem; overflow:hidden}
  .barFill{height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .25s ease}
  .resultCard{border-color:var(--accent)}
  .resultLabel{
    margin:0; font:600 .7rem/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  }
  .bigNumber{margin:.4rem 0 1.2rem; font-size:3.2rem; line-height:1; font-weight:600; letter-spacing:-.03em}
  .unit{font-size:1rem; font-weight:400; color:var(--muted); margin-left:.5rem; letter-spacing:0}
  .detail{margin:0; display:grid; gap:.55rem}
  .detail>div{display:flex; justify-content:space-between; gap:1rem; font-size:.92rem}
  .detail dt{color:var(--muted)}
  .detail dd{margin:0; font-variant-numeric:tabular-nums}
  .errorCard{border-color:var(--err)}
  .errText{margin:.5rem 0 0; color:var(--err); font-size:.92rem}
  textarea, pre, code, input{
    font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  textarea{
    width:100%; margin-top:.9rem; padding:.85rem .95rem; font-size:.87rem; line-height:1.6;
    background:var(--code-bg); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; resize:vertical;
  }
  textarea:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px}
  .controls{display:flex; align-items:center; gap:.8rem; margin:.9rem 0 1.2rem}
  button{
    font:600 .9rem ui-sans-serif,system-ui,sans-serif; padding:.55rem 1.3rem;
    background:var(--accent); color:#fff; border:0; border-radius:7px; cursor:pointer;
  }
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5; cursor:default}
  .runHint{font-size:.85rem; color:var(--muted)}
  .outLabel{
    margin:0 0 .4rem; font:600 .7rem/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  }
  pre{
    margin:0; padding:.85rem .95rem; min-height:3.5rem; font-size:.87rem; line-height:1.6;
    background:var(--code-bg); border:1px solid var(--line); border-radius:8px;
    white-space:pre-wrap; word-break:break-word;
  }
  pre.err{color:var(--err)}
  .ft{margin-top:2rem; padding-top:1.3rem; border-top:1px solid var(--line); color:var(--muted); font-size:.88rem}
  .ft p{margin:0}
  .srOnly{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

  /* gate */
  .gate{max-width:26rem; margin:0 auto; padding:5rem 1.5rem}
  .gate h1{font-size:1.5rem; margin-bottom:.5rem}
  .gate p.lede{margin-bottom:1.6rem}
  .gateForm{display:flex; gap:.6rem}
  .gateForm input{
    flex:1; padding:.6rem .8rem; font-size:.95rem; background:var(--surface);
    color:var(--ink); border:1px solid var(--line); border-radius:7px;
  }
  .gateMsg{margin:.9rem 0 0; font-size:.9rem; color:var(--err); min-height:1.3rem}
  .gateNote{margin:2rem 0 0; padding-top:1.1rem; border-top:1px solid var(--line);
            color:var(--muted); font-size:.85rem}
</style>
</head>
<body>

<div id="gate" class="gate">
  <p class="eyebrow">CS 115</p>
  <h1>This activity is locked</h1>
  <p class="lede">Enter the access phrase your instructor gave you at the start of class.</p>
  <form class="gateForm" id="gateForm" autocomplete="off">
    <label class="srOnly" for="pw">Access phrase</label>
    <input type="password" id="pw" placeholder="Access phrase" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit" id="gateBtn">Enter</button>
  </form>
  <p class="gateMsg" id="gateMsg" role="status"></p>
  <p class="gateNote">The phrase is case-sensitive. If you were in class and missed it, ask a neighbor before asking the instructor.</p>
</div>

<div id="content"></div>

  var ITER = 250000;

  var gate = document.getElementById("gate");
  var msg  = document.getElementById("gateMsg");
  var btn  = document.getElementById("gateBtn");
  var pw   = document.getElementById("pw");

  function b64(s) {
    var bin = atob(s), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  if (!window.crypto || !window.crypto.subtle) {
    msg.textContent = "This page must be opened over https:// — a local file:// copy cannot unlock it.";
    btn.disabled = true;
    return;
  }

  async function unlock(phrase) {
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey("raw", enc.encode(phrase), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(SALT), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(CT));
    return new TextDecoder().decode(plain);
  }

  function inject(html) {
    var host = document.getElementById("content");
    host.innerHTML = html;
    var scripts = host.querySelectorAll("script");
    for (var i = 0; i < scripts.length; i++) {
      var old = scripts[i];
      var s = document.createElement("script");
      for (var j = 0; j < old.attributes.length; j++) {
        s.setAttribute(old.attributes[j].name, old.attributes[j].value);
      }
      s.textContent = old.textContent;
      old.parentNode.replaceChild(s, old);
    }
  }

  document.getElementById("gateForm").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var phrase = pw.value.trim();
    if (!phrase) return;

    btn.disabled = true;
    msg.style.color = "var(--muted)";
    msg.textContent = "Checking…";

    try {
      var html = await unlock(phrase);
      gate.remove();
      inject(html);
    } catch (e) {
      msg.style.color = "var(--err)";
      msg.textContent = "That phrase does not unlock this activity. Check spelling and capitalization.";
      btn.disabled = false;
      pw.select();
    }
  });

  pw.focus();
})();
